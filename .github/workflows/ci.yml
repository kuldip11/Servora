name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurant_pos
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: pos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_user -d restaurant_pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://pos_user:pos_password@localhost:5432/restaurant_pos
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run migrations
        run: bun run db:migrate

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
